/* ---------- moteur : QUIZ ---------- */
function runQuiz(el,ex,cb){
  let i=0, wrong=0;
  const show=()=>{
    const q=ex.qs[i];
    el.innerHTML=`<div class="exhead"><div class="sub">Question ${i+1}/${ex.qs.length}</div>
      <div style="font-size:18px;font-weight:700;margin:8px 0 14px">${q.q}</div></div>`;
    const dots=document.createElement('div'); dots.className='exprog'; el.appendChild(dots);
    progDots(dots,ex.qs.length,i);
    q.opts.forEach((o,oi)=>{
      const b=document.createElement('button'); b.className='quizopt'; b.textContent=o;
      b.onclick=()=>{
        el.querySelectorAll('.quizopt').forEach(x=>x.style.pointerEvents='none');
        if(oi===q.a){ b.classList.add('right'); tada(); }
        else { b.classList.add('wrong'); wrong++; buzz();
          el.querySelectorAll('.quizopt')[q.a].classList.add('right'); }
        const why=document.createElement('div'); why.className='quizwhy'; why.textContent=q.why;
        el.appendChild(why);
        const nx=document.createElement('button'); nx.className='btn';
        nx.textContent=i+1<ex.qs.length?'Suivant →':'Terminer';
        nx.onclick=()=>{ i++; if(i<ex.qs.length) show(); else finish(); };
        el.appendChild(nx);
      };
      el.appendChild(b);
    });
  };
  const finish=()=>{
    const score=ex.qs.length-wrong;
    if(ex.scored){
      el.innerHTML=`<div class="exhead"><div class="target">${score}/${ex.qs.length}</div><div class="sub">Section notée.</div></div>`;
      setTimeout(()=>cb(true,score),900); return;
    }
    if(wrong===0) el.innerHTML=`<div class="exhead"><div class="target">🎯 ${score}/${ex.qs.length}</div><div class="sub">Sans faute. C'est comme ça qu'on bosse.</div></div>`;
    else if(score>=Math.ceil(ex.qs.length*0.6)) el.innerHTML=`<div class="exhead"><div class="target">${score}/${ex.qs.length}</div><div class="sub">Validé — mais relis les explications des erreurs avant de filer.</div></div>`;
    else { el.innerHTML=`<div class="exhead"><div class="target">${score}/${ex.qs.length}</div><div class="sub">Insuffisant. Relis la théorie et reviens — la base doit être béton.</div></div>`;
      const rb=document.createElement('button'); rb.className='btn'; rb.textContent='↻ Recommencer';
      rb.onclick=()=>{ i=0; wrong=0; show(); }; el.appendChild(rb); return; }
    setTimeout(()=>cb(true),1200);
  };
  show();
}

/* ---------- moteur : ACCORDS / VOICINGS ---------- */
function runChord(el,ex,cb){
  const items=ex.items||genChordItems(ex.gen);
  const pass=ex.pass||items.length;
  const hiKey=ex.hi||79;
  let i=0, fails=0, score=0, advancing=false; const badIdx=new Set(), failedItems=new Set();
  const sel=new Set();
  el.innerHTML=`<div class="exhead"><div class="target" id="tgt"></div><div class="sub">${ex.sub||''}</div>
    <button class="btn small ghost" id="listen" style="margin-top:8px">🔊 Écouter la cible</button></div>
    <div class="exprog" id="dots"></div><div id="kb"></div>
    <div class="fb" id="fb"></div>
    <div class="exrow"><button class="btn ghost" id="clr">Effacer</button><button class="btn" id="val">Valider</button></div>
    <button class="btn ghost" id="skip" style="display:none">⏭ Passer cet accord</button>`;
  el.querySelector('#listen').onclick=()=>{
    const it=items[i]; if(it) playChord(it.hint||voicingFor(it.root,it.t),1.6);
  };
  const kb=buildKeyboard(48,hiKey,(m,k)=>{
    if(sel.has(m)){ sel.delete(m); k.classList.remove('sel'); }
    else { sel.add(m); k.classList.add('sel'); playNote(m,.9); }
  });
  el.querySelector('#kb').appendChild(kb);
  const tgt=el.querySelector('#tgt'), fb=el.querySelector('#fb'), dots=el.querySelector('#dots');
  const skipBtn=el.querySelector('#skip');
  const show=()=>{
    const it=items[i]; sel.clear(); kb.clearSel(); advancing=false;
    tgt.textContent=it.label||chordName(it.root,it.t);
    fb.textContent=''; fb.className='fb'; fails=0;
    skipBtn.style.display='none';
    progDots(dots,items.length,i,badIdx);
  };
  /* un accord vraiment bloquant ne doit jamais figer toute la série */
  skipBtn.onclick=()=>{
    if(advancing) return;
    advancing=true; badIdx.add(i); failedItems.add(i);
    fb.textContent='Passé — reviens-y à froid, au vrai piano.'; fb.className='fb bad';
    setTimeout(()=>{ i++; if(i<items.length) show(); else finish(); },600);
  };
  const check=()=>{
    if(advancing) return;
    const it=items[i];
    if(!sel.size){ fb.textContent='Sélectionne des touches d\'abord.'; fb.className='fb bad'; return; }
    const need=[...new Set((it.iv||CT[it.t].iv).map(x=>(it.root+x)%12))];
    const pcs=[...new Set([...sel].map(m=>m%12))];
    const ok=pcs.length===need.length && need.every(p=>pcs.includes(p));
    if(ok){
      advancing=true; score++; playChord([...sel]); tada();
      fb.textContent='✓ '+(it.label||chordName(it.root,it.t))+' — '+(it.notesTxt||chordNotes(it.root,it.t)); fb.className='fb ok';
      setTimeout(()=>{ i++; if(i<items.length) show(); else finish(); },900);
    } else {
      fails++; failedItems.add(i);
      buzz(); kb.kbd.classList.add('shake'); setTimeout(()=>kb.kbd.classList.remove('shake'),400);
      if(fails===1) fb.textContent=it.msg1||('✗ Recompte — '+((it.iv||CT[it.t].iv).length)+' notes différentes.');
      else if(fails===2) fb.textContent='✗ Les notes : '+(it.notesTxt||chordNotes(it.root,it.t));
      else {
        fb.textContent='Regarde les touches bleues, joue-les (elles passent en orange), puis Valider.';
        (it.hint||voicingFor(it.root,it.t)).forEach(m=>{ const k=kb.keyEl(m); if(k) k.classList.add('hint'); });
        skipBtn.style.display='block';
      }
      fb.className='fb bad';
      if(fails>=3) badIdx.add(i);
    }
  };
  el.querySelector('#clr').onclick=()=>{ sel.clear(); kb.clearSel(); };
  el.querySelector('#val').onclick=check;
  const finish=()=>{
    const okPass=score>=pass;
    el.innerHTML=`<div class="exhead"><div class="target">${okPass?'🎩':'👹'} ${score}/${items.length}</div>
      <div class="sub">${okPass?(score===items.length?'Sans faute. Le club applaudit.':'Validé. Les accords ratés : rejoue-les au vrai piano, maintenant.')
      :'En dessous de '+pass+'/'+items.length+'. On ne monte pas sur scène avec ça : recommence.'}</div></div>`;
    if(!okPass){ const rb=document.createElement('button'); rb.className='btn'; rb.textContent='↻ Recommencer';
      rb.onclick=()=>{ el.innerHTML=''; runChord(el,ex,cb); }; el.appendChild(rb); return; }
    setTimeout(()=>cb(true,score,failedItems.size),1300);
  };
  show();
}

/* ---------- moteur : PROGRESSION ---------- */
function runProg(el,ex,cb){
  const seq=[]; for(let r=0;r<(ex.rounds||1);r++) seq.push(...ex.chords);
  let i=0, fails=0; const sel=new Set();
  const needOf=c=>[...new Set((c.iv||CT[c.t].iv).map(x=>(c.root+x)%12))];
  const labelOf=c=>c.label||chordName(c.root,c.t);
  el.innerHTML=`<div class="exhead"><div class="sub">${ex.sub||''}</div>
    <button class="btn small ghost" id="demo" style="margin-top:8px">🔊 Écouter la progression</button></div>
    <div class="chips" id="chips"></div><div id="kb"></div>
    <div class="fb" id="fb"></div>
    <div class="exrow"><button class="btn ghost" id="clr">Effacer</button><button class="btn" id="val">Valider</button></div>`;
  el.querySelector('#demo').onclick=()=>{
    ex.chords.forEach((c,ci)=>setTimeout(()=>{
      const v=c.iv?c.iv.map(x=>50+(((c.root+c.iv[0])-50)%12+12)%12+(x-c.iv[0])):voicingFor(c.root,c.t);
      playChord(v,1.1);
    },ci*900));
  };
  const kb=buildKeyboard(48,79,(m,k)=>{
    if(sel.has(m)){ sel.delete(m); k.classList.remove('sel'); }
    else { sel.add(m); k.classList.add('sel'); playNote(m,.9); }
  });
  el.querySelector('#kb').appendChild(kb);
  const chips=el.querySelector('#chips'), fb=el.querySelector('#fb');
  const draw=()=>{
    chips.innerHTML='';
    seq.forEach((c,ci)=>{
      const s=document.createElement('div');
      s.className='chip'+(ci===i?' cur':ci<i?' done':'');
      s.textContent=labelOf(c);
      chips.appendChild(s);
    });
  };
  const show=()=>{ sel.clear(); kb.clearSel(); fb.textContent=''; fb.className='fb'; fails=0; draw(); };
  el.querySelector('#clr').onclick=()=>{ sel.clear(); kb.clearSel(); };
  el.querySelector('#val').onclick=()=>{
    const c=seq[i];
    if(!sel.size){ fb.textContent='Sélectionne des touches d\'abord.'; fb.className='fb bad'; return; }
    const need=needOf(c);
    const pcs=[...new Set([...sel].map(m=>m%12))];
    const ok=pcs.length===need.length && need.every(p=>pcs.includes(p));
    if(ok){
      playChord([...sel]); tada();
      fb.textContent='✓ '+labelOf(c); fb.className='fb ok';
      setTimeout(()=>{ i++; if(i<seq.length) show(); else {
        el.innerHTML=`<div class="exhead"><div class="target">🌊</div>
          <div class="sub">Progression bouclée. Maintenant la vraie version : au piano, en boucle, sans regarder tes mains.</div></div>`;
        setTimeout(()=>cb(true),1300);
      }},800);
    } else {
      fails++; buzz(); kb.kbd.classList.add('shake'); setTimeout(()=>kb.kbd.classList.remove('shake'),400);
      fb.textContent=fails>=2?'✗ '+labelOf(c)+' = '+(c.iv?c.iv.map(x=>NOTE[(c.root+x)%12]).join(' – '):chordNotes(c.root,c.t))
        :'✗ Pas ça. Construis-le calmement.';
      fb.className='fb bad';
    }
  };
  show();
}

/* ---------- moteur : GAMME ---------- */
function runScale(el,ex,cb){
  const pcSeq=ex.pattern.map(p=>(ex.root+p)%12);
  let idx=0, startMidi=null, resets=0;
  el.innerHTML=`<div class="exhead"><div class="target">${ex.name}</div><div class="sub">${ex.sub||''}</div></div>
    <div class="exprog" id="dots"></div><div id="kb"></div><div class="fb" id="fb"></div>`;
  const dots=el.querySelector('#dots'), fb=el.querySelector('#fb');
  const kb=buildKeyboard(48,79,(m,k)=>{
    playNote(m,.8);
    if(idx===0 && m%12===pcSeq[0] && m+ex.pattern[ex.pattern.length-1]>79){
      fb.textContent='Bonne note, mais trop haut — le sommet sortirait du clavier. Commence plus grave.';
      fb.className='fb bad'; return;
    }
    const expected=idx===0?null:startMidi+ex.pattern[idx];
    const okTap=idx===0?(m%12===pcSeq[0]):(m===expected);
    if(okTap){
      if(idx===0) startMidi=m;
      k.classList.add('flash'); setTimeout(()=>k.classList.remove('flash'),250);
      idx++;
      progDots(dots,ex.pattern.length,idx);
      if(idx>=ex.pattern.length){
        tada();
        fb.textContent='✓ Gamme complète.'; fb.className='fb ok';
        el.querySelectorAll('.key').forEach(x=>x.style.pointerEvents='none');
        setTimeout(()=>{
          el.innerHTML=`<div class="exhead"><div class="target">🪜</div>
          <div class="sub">Bien. Maintenant au vrai piano : la même, en croches swing, métronome sur 2 et 4.</div></div>`;
          setTimeout(()=>cb(true),1300);
        },800);
      } else {
        fb.textContent='Note '+(idx+1)+'/'+ex.pattern.length+' — la suivante est à '+(ex.pattern[idx]-ex.pattern[idx-1])+' demi-ton(s).';
        fb.className='fb';
      }
    } else {
      buzz(); resets++;
      idx=0; startMidi=null;
      progDots(dots,ex.pattern.length,0);
      fb.textContent=resets>=3
        ?'✗ On repart du début. Formule : '+ex.pattern.slice(1).map((p,j)=>p-ex.pattern[j]).join('-')
        :'✗ Mauvaise note — on repart de la première.';
      fb.className='fb bad';
    }
  });
  el.querySelector('#kb').appendChild(kb);
  progDots(dots,ex.pattern.length,0);
  fb.textContent='Commence sur '+NOTE[pcSeq[0]]+' ('+NOTE_FR[pcSeq[0]]+').';
}

/* ---------- moteur : OREILLE ---------- */
const EAR_LBL={maj7:'maj7',m7:'m7',dom7:'7',m7b5:'ø7',dim7:'°7',dom9:'9',dom7b9:'7♭9',dom7s5:'7♯5',maj6:'6',m6:'m6'};
function runEar(el,ex,cb){
  let i=0, score=0, answered=false, cur=null; const badIdx=new Set();
  el.innerHTML=`<div class="exhead"><div class="target">👂</div><div class="sub">${ex.sub||''}</div></div>
    <div class="exprog" id="dots"></div>
    <div class="exrow"><button class="btn ghost" id="replay">🔊 Réécouter</button><button class="btn ghost" id="arp">🎵 Note par note</button></div>
    <div class="earbtns" id="btns"></div><div class="fb" id="fb"></div>`;
  const dots=el.querySelector('#dots'), fb=el.querySelector('#fb'), btns=el.querySelector('#btns');
  ex.kinds.forEach(k=>{
    const b=document.createElement('button'); b.className='btn ghost'; b.textContent=EAR_LBL[k]; b.dataset.k=k;
    b.onclick=()=>answer(k,b); btns.appendChild(b);
  });
  if(ex.kinds.length===3) btns.style.gridTemplateColumns='1fr 1fr 1fr';
  const notesOf=()=>CT[cur.t].iv.map(x=>cur.rootMidi+x);
  const playBlock=()=>{ if(cur) playChord(notesOf(),1.8,.03); };
  const playArp=()=>{ if(cur) notesOf().forEach((m,idx)=>playNote(m,.7,.4,idx*.5)); };
  el.querySelector('#replay').onclick=playBlock;
  el.querySelector('#arp').onclick=playArp;
  const next=()=>{
    answered=false;
    cur={ t:pick(ex.kinds), rootMidi:50+Math.floor(Math.random()*13) };
    fb.textContent=''; fb.className='fb';
    btns.querySelectorAll('.btn').forEach(b=>{ b.classList.remove('ok'); b.style.opacity=1; b.style.pointerEvents='auto'; });
    progDots(dots,ex.count,i,badIdx);
    setTimeout(playBlock,400);
  };
  const answer=(k,b)=>{
    if(answered) return; answered=true;
    btns.querySelectorAll('.btn').forEach(x=>x.style.pointerEvents='none');
    if(k===cur.t){ score++; b.classList.add('ok'); tada();
      fb.textContent='✓ '+EAR_LBL[cur.t]+' — '+chordNotes(cur.rootMidi%12,cur.t); fb.className='fb ok'; }
    else { buzz(); badIdx.add(i);
      fb.textContent='✗ C\'était '+EAR_LBL[cur.t]+'. Réécoute :'; fb.className='fb bad';
      btns.querySelector(`[data-k="${cur.t}"]`).classList.add('ok');
      setTimeout(playArp,350); }
    setTimeout(()=>{ i++; if(i<ex.count) next(); else finish(); }, k===cur.t?1200:2300);
  };
  const finish=()=>{
    const okPass=score>=(ex.pass||0);
    el.innerHTML=`<div class="exhead"><div class="target">${okPass?'👂':'😵'} ${score}/${ex.count}</div>
      <div class="sub">${okPass?'L\'oreille se muscle. Reviens demain — elle progresse en dormant.'
        :'En dessous de '+ex.pass+'/'+ex.count+'. Réécoute chaque couleur note par note, puis recommence.'}</div></div>`;
    if(score>S.earBest){ S.earBest=score; save(); }
    if(!okPass){ const rb=document.createElement('button'); rb.className='btn'; rb.textContent='↻ Recommencer';
      rb.onclick=()=>{ el.innerHTML=''; runEar(el,ex,cb); }; el.appendChild(rb); return; }
    setTimeout(()=>cb(true,score),1300);
  };
  next();
}

/* ---------- moteur : GUIDE TONES ---------- */
function runGuide(el,ex,cb){
  const chords=ex.chords;
  let i=0, fails=0, wrongTot=0, advancing=false; const sel=new Set();
  const needOf=c=>{ const [g3,g7]=guideIv(c.t); return [(c.root+g3)%12,(c.root+g7)%12]; };
  el.innerHTML=`<div class="exhead"><div class="target" id="tgt"></div>
    <div class="sub">${ex.sub||'La 3 et la 7 de chaque accord. Deux notes, toute l\'histoire.'}</div>
    <button class="btn small ghost" id="listen" style="margin-top:8px">🔊 Basse + guides</button></div>
    <div class="chips" id="chips"></div><div id="kb"></div>
    <div class="fb" id="fb"></div>
    <div class="exrow"><button class="btn ghost" id="clr">Effacer</button><button class="btn" id="val">Valider</button></div>
    <button class="btn ghost" id="gskip" style="display:none">⏭ Passer cet accord</button>`;
  const kb=buildKeyboard(48,76,(m,k)=>{
    if(sel.has(m)){ sel.delete(m); k.classList.remove('sel'); }
    else { sel.add(m); k.classList.add('sel'); playNote(m,.9); }
  });
  el.querySelector('#kb').appendChild(kb);
  const tgt=el.querySelector('#tgt'), fb=el.querySelector('#fb'), chips=el.querySelector('#chips');
  const midisOf=c=>{ const need=needOf(c); return need.map(pc=>52+((pc-52)%12+12)%12); };
  el.querySelector('#listen').onclick=()=>{
    const c=chords[i]; if(!c) return;
    playNote(36+c.root,1.6,.45);
    midisOf(c).forEach((m,ix)=>playNote(m,1.5,.32,.06+ix*.04));
  };
  const draw=()=>{
    chips.innerHTML='';
    chords.forEach((c,ci)=>{
      const s=document.createElement('div');
      s.className='chip'+(ci===i?' cur':ci<i?' done':'');
      s.textContent=chordName(c.root,c.t);
      chips.appendChild(s);
    });
    const cur=chips.children[i]; if(cur) cur.scrollIntoView({block:'nearest'});
  };
  const gskip=el.querySelector('#gskip');
  const show=()=>{
    sel.clear(); kb.clearSel(); advancing=false; fails=0;
    tgt.textContent=chordName(chords[i].root,chords[i].t);
    fb.textContent=''; fb.className='fb'; gskip.style.display='none'; draw();
  };
  gskip.onclick=()=>{
    if(advancing) return;
    advancing=true; wrongTot++;
    fb.textContent='Passé — celui-là, retravaille-le au piano.'; fb.className='fb bad';
    setTimeout(()=>{ i++; if(i<chords.length) show(); else finish(); },600);
  };
  el.querySelector('#clr').onclick=()=>{ sel.clear(); kb.clearSel(); };
  el.querySelector('#val').onclick=()=>{
    if(advancing) return;
    const c=chords[i], need=needOf(c);
    const pcs=[...new Set([...sel].map(m=>m%12))];
    if(!sel.size){ fb.textContent='Deux notes : la 3 et la 7.'; fb.className='fb bad'; return; }
    const ok=pcs.length===2 && need.every(p=>pcs.includes(p));
    if(ok){
      advancing=true;
      playNote(36+c.root,1.2,.4); [...sel].forEach((m,ix)=>playNote(m,1.2,.35,.05+ix*.03));
      tada();
      fb.textContent='✓ 3 = '+NOTE[need[0]]+' · 7 = '+NOTE[need[1]];
      fb.className='fb ok';
      setTimeout(()=>{ i++; if(i<chords.length) show(); else finish(); },800);
    } else {
      fails++; wrongTot++;
      buzz(); kb.kbd.classList.add('shake'); setTimeout(()=>kb.kbd.classList.remove('shake'),400);
      if(fails===1) fb.textContent='✗ Exactement DEUX notes : la 3 et la 7 de '+chordName(c.root,c.t)+'.';
      else { fb.textContent='✗ '+chordName(c.root,c.t)+' : 3 = '+NOTE[need[0]]+' · 7 = '+NOTE[need[1]]+' — joue les touches bleues, elles passent en orange.';
        midisOf(c).forEach(m=>{ const k=kb.keyEl(m); if(k) k.classList.add('hint'); });
        gskip.style.display='block'; }
      fb.className='fb bad';
    }
  };
  const finish=()=>{
    el.innerHTML=`<div class="exhead"><div class="target">🎯</div>
      <div class="sub">${wrongTot?'Ligne bouclée ('+wrongTot+' accroc'+(wrongTot>1?'s':'')+'). Refais-la au piano en rondes, en legato.':'Ligne parfaite. Tu viens de jouer le squelette d\'un vrai solo.'}</div></div>`;
    setTimeout(()=>cb(true,wrongTot),1300);
  };
  show();
}

         [B(7,'maj7'),B(10,'dom7')],[B(3,'maj7'),B(6,'dom7')],[B(11,'maj7')],[B(5,'m7'),B(10,'dom7')],
         [B(3,'maj7'),B(6,'dom7')],[B(11,'maj7'),B(2,'dom7')],[B(7,'maj7')],[B(1,'m7'),B(6,'dom7')],
         [B(11,'maj7'),B(2,'dom7')],[B(7,'maj7'),B(10,'dom7')],[B(3,'maj7'),B(1,'m7')],[B(6,'dom7')]]},

];
function walkBar(bar,nextRootPc){
  const N=pc=>38+(((pc-38)%12)+12)%12;
  const clamp=x=>{ while(x>52)x-=12; while(x<33)x+=12; return x; };
  const app=pc=>{ const t=N(pc); return clamp(t+(Math.random()<.5?1:-1)); };
  if(bar.length===2){
    const a=bar[0], b=bar[1];
    const mid=Math.random()<.5?N(a.r)+CT[a.t].iv[1]:N(a.r)+CT[a.t].iv[2];
    return [N(a.r), clamp(mid), N(b.r), app(nextRootPc)];
  }
  const c=bar[0], R=N(c.r), iv=CT[c.t].iv;
  const b2=clamp(Math.random()<.6?R+iv[1]:R+2);
  const b3=clamp(Math.random()<.6?R+iv[2]:R-5);
  return [R,b2,b3,app(nextRootPc)];
}
const COMPS=[[[0,1.6]],[[1.667,1.4]],[[0,.7],[1.667,1.6]],[[2,.9],[3.667,.35]],[[1.667,2.2]],[[0,.5],[2.667,.9]]];
const JP={
  on:false, g:null, piano:true, bpm:120, timer:null, uiTimer:null,
  barIdx:0, nextT:0, sched:[], nChorus:0, els:{},
  start(g){
    this.stopAll(false); const ctx=ac();
    this.g=g; this.on=true; this.barIdx=-1; this.nChorus=0;
    this.nextT=ctx.currentTime+.15; this.sched=[];
    this.timer=setInterval(()=>this.tick(),60); this.tick();
    /* UI sur interval, pas rAF : un rAF suspendu (onglet en fond) gèlerait l'affichage */
    this.uiTimer=setInterval(()=>this.frame(),120); this.frame();
    if(this.els.play) this.els.play.textContent='◼ Stop';
  },
  tick(){
    if(!this.on) return; const ctx=ac();
    while(this.nextT<ctx.currentTime+.9){
      const spb=60/this.bpm;
      this.schedBar(this.nextT,spb);
      this.sched.push({t:this.nextT,i:this.barIdx,spb});
      if(this.sched.length>10) this.sched.shift();
      this.nextT+=4*spb; this.barIdx++;
    }
  },
  schedBar(t0,spb){
    const ctx=ac(), rel=t0-ctx.currentTime;
    if(this.barIdx<0){
      for(let b=0;b<4;b++) Metro.click(t0+b*spb, b===0);
      return;
    }
    const L=this.g.bars.length, bi=this.barIdx%L, bar=this.g.bars[bi];
    const nextRoot=this.g.bars[(bi+1)%L][0].r;
    if(this.barIdx>0 && bi===0){
      setTimeout(()=>{ if(this.on) this.chorusDone(); }, Math.max(0,rel*1000));
    }
    [[0,0],[1,1],[1.667,0],[2,0],[3,1],[3.667,0]].forEach(([p,a])=>playRide(rel+p*spb,!!a));
    [1,3].forEach(p=>playHat(rel+p*spb));
    walkBar(bar,nextRoot).forEach((m,b)=>playBass(m, rel+b*spb, spb*1.05, .5));
    if(this.piano){
      if(bar.length===2){
        [[bar[0],0],[bar[1],2]].forEach(([c,off])=>{
          compVoi(c.r,c.t).forEach((m,ix)=>playNote(m,1.1*spb,.2,rel+off*spb+ix*.008));
        });
      } else {
        const c=bar[0], pat=pick(COMPS), v=compVoi(c.r,c.t);
        pat.forEach(([p,d])=>v.forEach((m,ix)=>playNote(m,d*spb*.9,.2,rel+p*spb+ix*.008)));
      }
    }
  },
  chorusDone(){
    this.nChorus++;
    if(this.nChorus===1){
      const id=this.g.id, first=!S.grids[id];
      S.grids[id]=(S.grids[id]||0)+1; save();
      award(first?12:6); dailyMark(2);
      toast(first?'🥁 Premier chorus complet · +12 XP':'🥁 Chorus bouclé · +6 XP');
    }
    if(this.els.cc) this.els.cc.textContent='chorus '+(this.nChorus+1);
  },
  frame(){
    if(!this.on) return;
    const now=ac().currentTime;
    let cur=null;
    for(const s of this.sched){ if(s.t<=now) cur=s; }
    if(cur && this.els.cn){
      if(cur.i<0){
        const beat=Math.floor((now-cur.t)/cur.spb);
        this.els.cn.textContent='· '+(4-Math.min(3,beat))+' ·';
        this.els.nx.textContent='Décompte…'; this.els.sc.textContent=''; this.els.gd.textContent='';
      } else {
        const L=this.g.bars.length, bi=cur.i%L, bar=this.g.bars[bi];
        const beat=(now-cur.t)/cur.spb;
        const half=(bar.length===2 && beat>=2)?1:0;
        const c=bar[half];
        const nxBar=this.g.bars[(bi+1)%L];
        const nxC=(bar.length===2&&half===0)?bar[1]:nxBar[0];
        this.els.cn.textContent=chordName(c.r,c.t);
        this.els.nx.textContent='puis : '+chordName(nxC.r,nxC.t)+' · mesure '+(bi+1)+'/'+L;
        const sf=scaleFor(c.r,c.t);
        this.els.sc.textContent='🗺 '+sf.name+' : '+sf.notes;
        const [g3,g7]=guideIv(c.t);
        this.els.gd.textContent='🎯 guides : '+NOTE[(c.r+g3)%12]+' & '+NOTE[(c.r+g7)%12];
        if(this._lastStrip!==bi && this.els.strip){
          this._lastStrip=bi;
          const cells=this.els.strip.children;
          for(let x=0;x<cells.length;x++) cells[x].classList.toggle('cur',x===bi);
          const cell=cells[bi]; if(cell) cell.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
        }
      }
    }
  },
  stopAll(ui=true){
    this.on=false;
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.uiTimer){ clearInterval(this.uiTimer); this.uiTimer=null; }
    this._lastStrip=-1;
    if(ui && this.els.play) this.els.play.textContent='▶ Lancer le trio';
  }
};

    opts.appendChild(cc);

    hintP.innerHTML=`<div class="tip" style="margin:10px 0">💡 ${g.hint}</div>

    inner.appendChild(hintP);

    play.onclick=()=>{ if(JP.on) JP.stopAll(); else JP.start(g); };
    inner.appendChild(play);
    JP.els={ cn:now.querySelector('#gcn'), nx:now.querySelector('#gnx'), sc:now.querySelector('#gsc'),
             gd:now.querySelector('#ggd'), strip, play, cc };
  });
}

/* ================================================================
   LE BILAN — évaluation d'entrée (et re-testable)
   ================================================================ */
function bilanChords(){
  /* dur : toutes les espèces + tensions + altérations, fondamentales variées */
  const specs=[['maj9',[0,5,10]],['dom7b9',[7,2,9]],['m7b5',[11,4,9]],['dim7',[1,8,3]],
               ['dom7s5',[7,0,3]],['m9',[2,10,5]]];
  return specs.map(([t,rr])=>{ const root=pick(rr); return {root,t}; });
}
function bilanVoicings(){
  const items=[];
  items.push(genShellItems(1)[0]);
  items.push(genRootlessItems(1,'A')[0]);
  items.push(genRootlessItems(1,'B')[0]);
  items.push(genSoWhatItems(1)[0]);
  items.push(genUpperItems(1)[0]);
  return items;
}
function bilanGuideChords(){
  const k1=pick([1,6,3,8]), k2=pick([4,11,9,2]); /* tonalités « pénibles » */
  return iiVI(k1).concat(iiVI(k2));
}
const BILAN_AXES=[
  {key:'harmonie', label:'Harmonie', ico:'🎨'},
  {key:'voicings', label:'Voicings', ico:'🎩'},
  {key:'theorie',  label:'Théorie',  ico:'🗺'},
  {key:'oreille',  label:'Oreille',  ico:'👂'},
  {key:'placement',label:'Guides',   ico:'🎯'},
];
function bilanLevel(g){
  if(g<35) return {name:'Découvre le jazz', reco:'Commence tranquillement au Module 1 — les fondations d\'abord.', tag:'🌱'};
  if(g<55) return {name:'En chemin', reco:'Solidifie les voicings (Module 2) et le ii–V–I (Module 3) avant l\'impro.', tag:'🎹'};
  if(g<72) return {name:'Solide', reco:'Attaque l\'improvisation (Module 5) et le temps (Module 6). L\'avancé viendra vite.', tag:'🎷'};
  if(g<88) return {name:'Avancé', reco:'Le Module 8 et le terrain difficile (Coltrane, Bird blues) sont pour toi.', tag:'🎩'};
  return {name:'Redoutable', reco:'Franchement ? Sers-toi de l\'app comme sparring-partner : grilles dures, tempo max, oreille sur les altérées.', tag:'🏆'};
}
function runBilan(returnTo){
  openCustom('🎓 Le bilan de '+USER,(inner,close)=>{
    const intro=document.createElement('div'); intro.className='theory';
    intro.innerHTML=`<p>Cinq épreuves, ~5 minutes. On note ta <b>précision au premier essai</b> — donc pas d'aide, pas de clavier libre à côté. À la fin : ton profil complet et par où commencer.</p>
      <div class="warn">Sois honnête avec toi-même : un bilan gonflé ne trompe que le prochain toi qui se plantera en jam.</div>`;
    inner.appendChild(intro);
    const start=document.createElement('button'); start.className='btn'; start.textContent='🎯 Lancer le bilan';
    inner.appendChild(start);
    const skip=document.createElement('button'); skip.className='btn ghost'; skip.textContent='Plus tard';
    skip.onclick=()=>{ close(); if(returnTo) returnTo(); };
    inner.appendChild(skip);
    start.onclick=()=>{
      intro.remove(); start.remove(); skip.remove();
      const axes={};
      const wrap=document.createElement('div'); inner.appendChild(wrap);
      const seq=[
        ['1/5 · Lecture d\'accords','harmonie','chord',
          {items:bilanChords(),pass:0,hi:79,sub:'Construis chaque accord. Aucune aide.'},
          (r,ex)=>ex.items.length-(r.b||0)],
        ['2/5 · Voicings pro','voicings','chord',
          {items:bilanVoicings(),pass:0,hi:84,sub:'Shell, rootless A/B, So What, upper structure. Tu les connais ou pas.'},
          (r,ex)=>ex.items.length-(r.b||0)],
        ['3/5 · Théorie & couleurs','theorie','quiz',
          {qs:genCSQs(6),scored:true},
          (r)=>r.a||0],
        ['4/5 · Oreille','oreille','ear',
          {kinds:['maj7','m7','dom7','m7b5','dim7','dom7b9'],count:6,pass:0,sub:'À l\'aveugle : nomme la couleur.'},
          (r)=>r.a||0],
        ['5/5 · Guide tones','placement','guide',
          {chords:bilanGuideChords(),sub:'La 3 et la 7 de chaque accord — dans des tonalités pénibles.'},
          (r,ex)=>ex.chords.length-Math.min(r.a||0,ex.chords.length)],
      ];
      const totals={harmonie:6,voicings:5,theorie:6,oreille:6,placement:6};
      let k=0;
      const next=()=>{
        wrap.innerHTML='';
        if(k>=seq.length) return finishBilan();
        const [title,axis,type,ex,scoreFn]=seq[k];
        const lab=document.createElement('p');
        lab.style.cssText='text-align:center;color:var(--acc);font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px';
        lab.textContent=title;
        wrap.appendChild(lab);
        const box=document.createElement('div'); wrap.appendChild(box);
        const eng={chord:runChord,quiz:runQuiz,ear:runEar,guide:runGuide}[type];
        eng(box,ex,(ok,a,b)=>{
          const sc=scoreFn({a,b},ex);
          axes[axis]=Math.max(0,Math.round(sc/totals[axis]*100));
          k++; next();
        });
      };
      const finishBilan=()=>{
        const vals=BILAN_AXES.map(a=>axes[a.key]||0);
        const global=Math.round(vals.reduce((s,x)=>s+x,0)/vals.length);
        const lv=bilanLevel(global);
        S.bilan={date:todayStr(), axes, global}; S.assessed=true; save();
        if(!S._bilanXP){ S._bilanXP=true; award(40); }
        wrap.innerHTML='';
        const head=document.createElement('div'); head.className='exhead';
        head.innerHTML=`<div class="target">${lv.tag} ${global}/100</div>
          <div class="sub">Profil de ${USER} · niveau estimé : <b style="color:var(--acc)">${lv.name}</b></div>`;
        wrap.appendChild(head);
        const bars=document.createElement('div'); bars.className='bilanbars';
        BILAN_AXES.forEach(a=>{
          const v=axes[a.key]||0;
          const row=document.createElement('div'); row.className='brow';
          row.innerHTML=`<span class="bl">${a.ico} ${a.label}</span>
            <span class="bt"><i style="width:${v}%;background:${v>=70?'var(--ok)':v>=45?'var(--acc)':'var(--bad)'}"></i></span>
            <span class="bv">${v}</span>`;
          bars.appendChild(row);
        });
        wrap.appendChild(bars);
        const reco=document.createElement('div'); reco.className='theory';
        reco.innerHTML=`<div class="tip" style="margin:14px 0">🧭 ${lv.reco}</div>
          <p style="color:var(--dim);font-size:13px">Tu pourras refaire ce bilan quand tu veux (onglet Outils) pour mesurer le chemin parcouru.</p>`;
        wrap.appendChild(reco);
        const done=document.createElement('button'); done.className='btn'; done.textContent='C\'est parti — vers le parcours';
        done.onclick=()=>{ close(); tab='parcours';
          document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='parcours'));
          render(); };
        wrap.appendChild(done);
      };
      next();
    };
  });
}

  openCustom('👋 Bienvenue',(inner,close)=>{
    overlayInner.querySelector('.back').style.visibility='hidden';
    const t=document.createElement('div'); t.className='theory';
    t.innerHTML=`<h3 style="font-size:20px">Salut ${USER} 🎹</h3>
      <p>Bienvenue dans <b>Sideman</b> — l'appli qui te fait passer de « bon pianiste » à <b>jazzman</b> : voicings, ii–V–I dans les 12 tons, impro, comping, formes… jusqu'aux Coltrane changes.</p>
      <p>Tu joues déjà bien : on ne va pas te faire réviser tes gammes. On commence par un <b>bilan</b> pour situer exactement ton niveau et te dire par où attaquer.</p>
      <div class="tip">Tout est jouable sur le clavier de l'écran, mais chaque exercice a sa vraie version : <b>ton piano</b>. L'app valide ta tête ; le piano valide tes doigts.</div>`;

    go.onclick=()=>{ close(); runBilan(); };

    later.onclick=()=>{ S.assessed=true; save(); close(); };
    inner.appendChild(later);
  });
}
